# Nginx Server Block Configuration for Sruthij S Nair Portfolio
# Path on Ubuntu EC2: /etc/nginx/sites-available/sruthij-portfolio

server {
    listen 80;
    listen [::]:80;
    
    # Replace YOUR_DOMAIN_OR_PUBLIC_IP with your actual EC2 Elastic IP or domain name
    server_name YOUR_DOMAIN_OR_PUBLIC_IP;

    root /var/www/sruthij-portfolio;
    index index.html;

    # Gzip Compression for Optimal Web Performance
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied expired no-cache no-store private auth;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml application/javascript application/json image/svg+xml;
    gzip_disable "MSIE [1-6]\.";

    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # SPA Fallback for React Router (Supports /work/lumina-health, /work/dentcare direct access)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache static assets with aggressive expires
    location ~* \.(?:css|js|webp|svg|png|jpg|jpeg|gif|ico|woff2?|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Error handling
    error_page 404 /index.html;
}
